<section class="auth-shell">
  <div class="auth-card">
    <div style="text-align:center;margin-bottom:24px">
      <div class="logo-mark" style="margin:0 auto 14px;width:54px;height:54px;border-radius:14px">P</div>
      <h2>Área do Cliente</h2>
      <p class="muted" id="authSubtitle">Acesse a sua área para acompanhar tudo da Prolans em um só lugar.</p>
    </div>

    <div class="auth-tabs">
      <button data-mode="login" class="active">Entrar</button>
      <button data-mode="register">Criar conta</button>
    </div>

    <form id="authForm">
      <div class="field" id="nameField" style="display:none;margin-bottom:14px">
        <label>Nome completo</label>
        <input type="text" name="nome" placeholder="Seu nome" />
      </div>
      <div class="field" style="margin-bottom:14px">
        <label>E-mail</label>
        <input type="email" name="email" required placeholder="voce@email.com" />
      </div>
      <div class="field" style="margin-bottom:18px">
        <label>Senha</label>
        <input type="password" name="senha" required placeholder="••••••••" minlength="4" />
      </div>
      <button class="btn btn-primary btn-block" id="authSubmit" type="submit">Entrar</button>
    </form>

    <div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--border);text-align:center">
      <p class="muted" style="font-size:.82rem;line-height:1.5">
        Esqueceu seus dados?

      </p>
    </div>
  </div>
</section>
